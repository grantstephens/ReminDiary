# Annotated copy of the recipe submitted to fdroiddata as
# metadata/xyz.hub13.remindiary.yml (MR !46769 against
# https://gitlab.com/fdroid/fdroiddata). The canonical, comment-stripped
# version lives there and on the fdroiddata fork branch; this copy keeps
# the reasoning behind each real, CI-verified decision for future
# maintenance. Every claim below has been confirmed against a real
# fdroiddata CI pipeline, not guessed - keep this copy in sync whenever
# the pushed recipe changes.

# Note, not Writing - pushed back initially (Writing's official description
# explicitly says "journaling"), but there's no dedicated Journal category
# and the reviewer's point stands: the line between quick notes and
# journaling is genuinely blurry for an app that's both. Deferred to their
# call rather than relitigate a subjective categorization.
Categories:
  - Note
License: GPL-3.0-or-later
# Added after a reviewer comment asked for author info - sampled real
# convention across the fdroiddata repo rather than guessing: AuthorName +
# AuthorEmail is the most common pair, AuthorWebSite common alongside it.
# WebSite is a separate field for the app's own site (remindiary.hub13.xyz,
# stood up earlier this session), distinct from the author's personal one.
AuthorName: Grant Stephens
AuthorEmail: grant@stephens.co.za
AuthorWebSite: https://grant.stephens.co.za
WebSite: https://remindiary.hub13.xyz
SourceCode: https://github.com/grantstephens/ReminDiary
IssueTracker: https://github.com/grantstephens/ReminDiary/issues
Changelog: https://github.com/grantstephens/ReminDiary/releases

AutoName: ReminDiary

# No inline Description: field - three rounds of the same reviewer comment
# ("Don't add summary and description... Add them in fastlane structure in
# your repo and they will be pulled from there") turned out to be about
# this field specifically, not the metadata/<id>/<locale>/ directory
# removed earlier (confirmed via the comment's exact diff position once
# they anchored it to a line). Not schema-required (checked schemas/
# metadata.json's required list) - fdroidserver already pulls the
# equivalent text from fastlane/metadata/android/en-US/full_description.txt
# in the app's own repo at build/update time, confirmed by the codequality
# report still showing it found there with this field gone.

RepoType: git
Repo: https://github.com/grantstephens/ReminDiary.git

Builds:
  # Reviewer asked to drop the older version ("Remove the old version."):
  # this app had not been published yet, so nothing depended on v1.0.0
  # staying buildable. v1.0.1 is now the sole release - AutoUpdateMode:
  # Version (enabled above) auto-generates future entries from whatever
  # are the last N (see VercodeOperation below), so there is no ongoing
  # need to keep a superseded entry around.
  #
  # ABI split (reviewer request, per https://f-droid.org/en/docs/
  # Submitting_to_F-Droid_Quick_Start_Guide/#setup-abi-split): one Builds
  # entry per ABI instead of a single universal APK - armeabi-v7a and
  # arm64-v8a only, following com.marlinid.marlin.yml's real, already-
  # merged precedent of skipping the emulator-only x86/x86_64 pair.
  # versionCode is base * 10 + 1/+2 (VercodeOperation below), matching
  # the doc's required v7a < v8a < x86 < x86_64 ordering. Each entry
  # passes -PreactNativeArchitectures=<abi> directly in its own build:
  # block rather than using the gradleprops: field marlin's recipe uses -
  # gradleprops: only takes effect for the `gradle:` build method
  # (checked build.py), and this recipe uses output: + a custom build:
  # block instead, because (unlike marlin's repo, which commits android/
  # to git) ReminDiary is pure Expo managed-workflow: android/ is
  # generated fresh by `expo prebuild` and never committed, so `subdir:
  # android/app` + `gradle: yes` would fail the pre-build directory-
  # exists check (see the note below UpdateCheckMode for the earlier,
  # equivalent finding this is the same root cause as).
  # Reproducible build (reviewer request): Binaries/binary + AllowedAPKSigning
  # Keys work by transplanting the reference binary's signature onto
  # F-Droid's own from-source build and checking it still verifies
  # (apksigcopier) - which only succeeds if the two are byte-identical.
  # Couldn't backfill this onto v1.0.1: that requires release.yml's new
  # per-ABI split build (added after v1.0.1 was tagged, so its checked-out
  # source doesn't have the tooling). v1.0.2 is a real tagged release built
  # with the updated release.yml, so both Builds entries below now target
  # it instead, each with its own `binary:` pointing at the matching real,
  # already-published split APK. AllowedAPKSigningKeys is the real release
  # keystore's SHA-256 fingerprint, extracted straight from a published
  # signed APK via `apksigner verify --print-certs` - no access to the
  # private keystore needed, confirmed identical across both split APKs.
  #
  # Getting byte-identical took five straight environment/toolchain fixes
  # (JDK, Node, NDK, absolute build paths, buildFromSource) that closed the
  # gap down to just resources.arsc + six native .so files still differing.
  # Diffing the real extracted bytes (not guessing) found two distinct,
  # confirmed root causes, both non-deterministic build *inputs* rather than
  # toolchain mismatches:
  #
  # 1. resources.arsc: @react-native/gradle-plugin's configureDevServerLocation()
  #    bakes the build machine's own LAN IP into a release resource string
  #    (react_native_dev_server_ip, via getHostIpAddress()) unless overridden
  #    with the reactNativeDevServerIp Gradle property - GitHub's runner and
  #    F-Droid's buildserver each have their own address, and every other
  #    byte difference in the file cascaded from that one string's length
  #    changing aapt2's alphabetical string-pool ordering. Pinned to the same
  #    fixed value on both sides (build: below and release.yml).
  # 2. Five of six .so files: differed *only* in their linker-generated
  #    .note.gnu.build-id (a 20-byte hash computed mid-link, before
  #    debug-symbol stripping - not meaningful once symbols are stripped, and
  #    not guaranteed to match even for byte-identical final output).
  #    tools/zero-elf-build-id.py zeroes it in place on both sides rather
  #    than trying to make its computation deterministic.
  #
  # Both fixes still require the packaging-level zipalign fix below: fixing
  # content alone doesn't help unless the two APKs' local-entry regions also
  # land at the same byte length, which is what apksigcopier's signature
  # transplant actually requires to succeed (confirmed via a real failure:
  # "APK Signing Block offset < central directory offset", traced to
  # fdroidserver's own patch_v2_sig() requiring exactly this).
  # dev.djara.wafrn_rn.yml (a real, merged fdroiddata recipe combining ABI
  # split with reproducible builds for an Expo/RN app) uses the same
  # srclibs/postbuild zipalign pattern below - copied rather than reinvented.
  # release.yml applies the identical zipalign normalization (same tool, same
  # tag) to its own from-source build of the reference APKs before signing
  # them externally with apksigner, instead of letting Gradle sign - the two
  # sides only land at the same byte length if both apply it.
  #
  # One .so (libreact_codegen_rnscreens.so) had a further, unexplained
  # structural difference beyond the build-id (a real 16-byte size gap,
  # confirmed via direct extraction and comparison) - not yet resolved by
  # either fix above. Whether it survives is something the next real CI
  # pipeline will show.
  - versionName: 1.0.2
    versionCode: 100029991
    commit: 0892f159f25b4ac753efb2be64799916ceae6450
    binary: https://github.com/grantstephens/ReminDiary/releases/download/v1.0.2/remindiary-v1.0.2-armeabi-v7a.apk
    srclibs:
      - reproducible-apk-tools@v0.3.0
    sudo:
      - echo "deb http://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm
    init:
      - export CI=1
      - export EXPO_NO_TELEMETRY=1
      - npm ci
    prebuild:
      - export CI=1
      - export EXPO_NO_TELEMETRY=1
      # Combines what used to be two separate sed invocations into one,
      # per a reviewer suggestion - anchored on the generic "android": {
      # structure rather than this app's own package name, so it isn't
      # tied to a single app.json. $$VERSION$$/$$VERCODE$$ are real
      # fdroidserver placeholders (common.py's replace_build_vars()),
      # substituted at build time from this Builds entry's own top-level
      # fields - which is what makes AutoUpdateMode: Version below safe.
      # Verified locally against the real app.json before pushing: only
      # one "version" match in this file, so the broader pattern is safe.
      - sed -i -e '/"version"/s/1.0.0/$$VERSION$$/' -e '/"android":\ {/a "versionCode":$$VERCODE$$,'
        app.json
      - sed -i -e '1a "expo":{"autolinking":{"android":{"buildFromSource":[".*"]}}},' package.json
      - npx expo prebuild --platform android --no-install
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - sed -i -e '/signingConfig /d' android/app/build.gradle
      - printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g\n' >> android/gradle.properties
    build:
      - cd android/app
      - gradle -PreactNativeArchitectures=armeabi-v7a assembleRelease -PreactNativeDevServerIp=localhost
    postbuild:
      - python3 tools/zero-elf-build-id.py $$OUT$$
      - mv $$OUT$$ unaligned.apk
      - $$reproducible-apk-tools$$/zipalign.py --page-size 16 --pad-like-apksigner --replace unaligned.apk $$OUT$$
    scanignore:
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/react-native/ReactAndroid/publish.gradle
    scandelete:
      - node_modules/
    output: android/app/build/outputs/apk/release/*.apk

  - versionName: 1.0.2
    versionCode: 100029992
    commit: 0892f159f25b4ac753efb2be64799916ceae6450
    binary: https://github.com/grantstephens/ReminDiary/releases/download/v1.0.2/remindiary-v1.0.2-arm64-v8a.apk
    srclibs:
      - reproducible-apk-tools@v0.3.0
    sudo:
      - echo "deb http://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm
    init:
      - export CI=1
      - export EXPO_NO_TELEMETRY=1
      - npm ci
    prebuild:
      - export CI=1
      - export EXPO_NO_TELEMETRY=1
      - sed -i -e '/"version"/s/1.0.0/$$VERSION$$/' -e '/"android":\ {/a "versionCode":$$VERCODE$$,'
        app.json
      - sed -i -e '1a "expo":{"autolinking":{"android":{"buildFromSource":[".*"]}}},' package.json
      - npx expo prebuild --platform android --no-install
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - sed -i -e '/signingConfig /d' android/app/build.gradle
      - printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g\n' >> android/gradle.properties
    build:
      - cd android/app
      - gradle -PreactNativeArchitectures=arm64-v8a assembleRelease -PreactNativeDevServerIp=localhost
    postbuild:
      - python3 tools/zero-elf-build-id.py $$OUT$$
      - mv $$OUT$$ unaligned.apk
      - $$reproducible-apk-tools$$/zipalign.py --page-size 16 --pad-like-apksigner --replace unaligned.apk $$OUT$$
    scanignore:
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/react-native/ReactAndroid/publish.gradle
    scandelete:
      - node_modules/
    output: android/app/build/outputs/apk/release/*.apk

# UpdateCheckMode: Tags makes `fdroid checkupdates` check out each of the
# repo's recent tags and look for a committed AndroidManifest.xml to read
# versionCode/versionName from (confirmed by a real CI failure on the
# actual fdroiddata pipeline) - but android/ is generated by `expo
# prebuild` mid-recipe, never committed, so no tag ever has had one, and
# checkupdates hard-failed with "Couldn't find any version information"
# rather than skipping quietly.
#
# The real fix - not just avoiding the failure - is UpdateCheckData
# pointed at fdroid-version.txt, a small file this repo's own
# `make prepare-release` (see README.md "Releasing") writes and commits
# before every tag, containing the exact versionCode ReminDiary's own
# release.yml computes (tools/compute-version.sh is the single source of
# truth both share). The pattern below is verified against fdroidserver's
# actual check_tags() source and tested end-to-end against a real
# committed fdroid-version.txt: filever "." means "reuse the same file's
# content for the versionName regex too" (the exact pattern
# com.mmazzarolo.breathly.yml uses against app.json), not "match the tag
# text" - confirmed by reading checkupdates.py directly rather than
# guessing. v1.0.1 (github.com/grantstephens/ReminDiary/releases/tag/v1.0.1)
# is the first real tag that carries the file, and Tags mode below is
# confirmed working against it on this branch's own CI, not assumed.
#
# AutoUpdateMode: Version - safe now that prebuild: uses $$VERSION$$/
# $$VERCODE$$ instead of hardcoded literals (see prebuild: above), so a
# checkupdates --auto clone of the last Builds entry needs only its own
# top-level versionCode/versionName/commit updated, which is exactly what
# that mechanism does. UpdateCheckMode: Tags means the auto-generated
# entry's commit resolves through a real tag lookup (vcs.getref()) to an
# actual SHA, not the tag name, satisfying the earlier full-commit-hash
# requirement automatically for future releases too. Previously this
# stayed None because the version patch hardcoded literals that couldn't
# safely be auto-generated - resolved by removing the literals, not by
# arguing they were unavoidable.

# Real release keystore's SHA-256 fingerprint (see the reproducible-build
# comment on the first Builds entry above) - pins which signing key the
# binary:-referenced reference APKs must actually be signed with.
AllowedAPKSigningKeys: a79298e44336ddcb4d63b728d70dda772381274274cbb44609bdaa6ff2e2f328

AutoUpdateMode: Version
UpdateCheckMode: Tags
# Derives each ABI split's versionCode from the raw one fdroid-version.txt
# carries (see above) - %c * 10 + 1 for armeabi-v7a, + 2 for arm64-v8a,
# matching the two Builds entries above in the same order. CurrentVersionCode
# below must be the max of these (checkupdates' own "up to date" check
# compares against vercodes[-1] after sorting), confirmed against a real
# green checkupdates job on this branch's CI with this exact value.
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
UpdateCheckData: fdroid-version.txt|versionCode=([0-9]+)|.|versionName=(.+)
CurrentVersion: 1.0.2
CurrentVersionCode: 100029992
