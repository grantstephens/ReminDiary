# This is a working copy of the recipe that would eventually be copied into
# a checkout of https://gitlab.com/fdroid/fdroiddata as
# metadata/xyz.hub13.remindiary.yml for the inclusion merge request. It has
# NOT been run against F-Droid's actual isolated buildserver yet — every
# block marked VERIFY below is a guess grounded in this repo's own working
