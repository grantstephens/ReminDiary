    prebuild:
      - export CI=1
      - export EXPO_NO_TELEMETRY=1
      - |-
        node -e "
        const fs = require('fs');
        const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
        config.expo.version = '1.0.1';
        config.expo.android.versionCode = 10001999;
        fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
        "
      - |-
        node -e "
        const fs = require('fs');
        const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
        pkg.expo = pkg.expo || {};
        pkg.expo.autolinking = { android: { buildFromSource: ['.*'] } };
        fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
        "
      - npx expo prebuild --platform android --no-install
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - python3 -c "path = 'android/app/build.gradle'; f = open(path); content = f.read();
        f.close(); anchor = '            // Caution! In production, you need to generate
        your own keystore file.\n            // see https://reactnative.dev/docs/signed-apk-android.\n            signingConfig
        signingConfigs.debug'; line = '\n            signingConfig signingConfigs.debug';
        assert content.count(anchor) == 1, 'signingConfig anchor not found verbatim'; stripped
        = anchor.replace(line, ''); content = content.replace(anchor, stripped, 1); f =
        open(path, 'w'); f.write(content); f.close()"
      - printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g\n' >> android/gradle.properties
    build:
      - cd android/app
      - gradle assembleRelease
    rm:
      - node_modules/@expo/expo-modules-macros-plugin/apple/
      - node_modules/expo-sqlite/ios/
