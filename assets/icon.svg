<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    ReminDiary launcher icon (React Native app).

    A flat re-draw of legacy-fyne/icon.svg's stacked-date-cards concept: three
    solid cards, no gradients or blurred drop shadows, so it stays crisp at
    small sizes and survives Android's adaptive-icon squircle crop without
    the layered edges disappearing into blur. The front card's numeral is the
    same outlined-path technique the legacy icon uses (via Inkscape's
    export-text-to-path option, source font Liberation Sans Bold) rather than
    text, so this file renders identically on a machine with no fonts.

    Full-bleed background, artwork centered - see icon-foreground.svg and
    icon-monochrome.svg for the split layers Android's adaptive icon needs.
  -->
  <rect width="1024" height="1024" fill="#2E2A26"/>
  <rect x="352" y="362" width="440" height="460" rx="40" fill="#7C8C5E"/>
  <rect x="322" y="332" width="440" height="460" rx="40" fill="#B7C4A0"/>
  <rect x="292" y="302" width="440" height="460" rx="40" fill="#F4EFE6"/>
