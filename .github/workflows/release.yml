# Builds a signed APK and AAB on tag push and attaches them to a GitHub
# Release, which is what Obtainium watches.
#
# Required repository secrets (see README.md "Signing setup" for how to
# generate the keystore and set these):
#   ANDROID_KEYSTORE_BASE64  - base64 of your .keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

env:
  BUNDLETOOL_VERSION: '1.18.3'

jobs:
  check:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci
      - run: npm run check

  release:
    name: Signed APK and AAB
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci

      # expo prebuild's generated Android project needs JDK 17; the runner's
      # default `java` is not guaranteed to be it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # apksigner and aapt (used below in "Verify artefacts") live in the
      # Android SDK's build-tools, which is not on PATH by default.
      - name: Configure Android toolchain
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"

      # versionCode is a packed integer, not just the tag - see
      # tools/compute-version.sh for the scheme and why. That script is the
      # single source of truth for this arithmetic, shared with
      # `make prepare-release`, which commits its output into
      # fdroid-version.txt before tagging so F-Droid's checkupdates can read
      # a real versionCode without needing arithmetic of its own.
      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          eval "$(tools/compute-version.sh "$TAG")"
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "name=$versionName"  >> "$GITHUB_OUTPUT"
          echo "code=$versionCode"  >> "$GITHUB_OUTPUT"
          echo "Building $TAG as versionName=$versionName versionCode=$versionCode"

      # expo prebuild bakes app.json's version/android.versionCode straight
      # into the generated build.gradle and AndroidManifest.xml, so this is
      # the one piece of the release build that does not need a post-prebuild
      # patch - it just needs the right input.
      - name: Set app.json version
        run: |
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            config.expo.version = '${{ steps.version.outputs.name }}';
            config.expo.android.versionCode = ${{ steps.version.outputs.code }};
            fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
          "

      - name: Prebuild the native Android project
        run: npx expo prebuild --platform android --no-install

      # expo prebuild's generated build.gradle signs the "release" build
      # type with the debug keystore by default - its own comment says as
      # much: "Caution! In production, you need to generate your own
      # keystore file." expo prebuild regenerates android/ from scratch
      # every run (Continuous Native Generation), so this has to be patched
      # here rather than hand-edited once. Anchored on the exact text of the
      # current Expo template; asserts both anchors are found exactly once,
      # so a future template change fails the build loudly instead of
      # quietly shipping a debug-signed "release" APK.
      - name: Patch release signing config
        run: python3 tools/patch-release-signing.py

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See README.md 'Signing setup'."
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Build signed AAB
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew bundleRelease

      # Obtainium installs APKs, not bundles; bundletool flattens the AAB
      # into one universal APK covering every ABI, signed with the same key.
      - name: Build universal APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.bundletool"
          curl -fsSL -o "$HOME/.bundletool/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          java -jar "$HOME/.bundletool/bundletool.jar" build-apks \
            --bundle=android/app/build/outputs/bundle/release/app-release.aab \
            --output="$RUNNER_TEMP/app.apks" \
            --mode=universal \
            --ks="$RUNNER_TEMP/keystore.jks" \
            --ks-pass="pass:$KS_PASS" \
            --ks-key-alias="$KEY_ALIAS" \
            --key-pass="pass:$KEY_PASS"
          unzip -p "$RUNNER_TEMP/app.apks" universal.apk \
            > "remindiary-${{ steps.version.outputs.tag }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
            "remindiary-${{ steps.version.outputs.tag }}.aab"

      # Assertions, not just output: a silent regression here ships a
      # broken, over-permissioned, or wrongly-signed build to everyone
      # running Obtainium.
      - name: Verify universal APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          tools/verify-release-apk.sh \
            "remindiary-${{ steps.version.outputs.tag }}.apk" \
            "${{ steps.version.outputs.code }}"

      # F-Droid's own build (see fdroid/xyz.hub13.remindiary.yml) splits by
      # ABI rather than shipping one universal APK, to cut the real per-
      # device download roughly in half. Its reproducible-build check
      # ("Binaries:"/per-build "binary:") verifies its from-source build is
      # byte-identical to a reference binary via signature transplant
      # (apksigcopier) - which only works if the reference is built the
      # exact same way: a fresh `expo prebuild` per ABI (not a post-hoc
      # build.gradle patch, which risks producing subtly different output),
      # with that split's own versionCode (base * 10 + 1 for armeabi-v7a,
      # + 2 for arm64-v8a - matching the fdroid recipe's VercodeOperation)
      # baked in before prebuild runs, exactly like F-Droid's own build.
      #
      # These are published alongside the universal APK deliberately, not
      # hidden: since GitHub Releases has no way to mark an asset "reference
      # only", anyone can already see and download them, so they might as
      # well be usable as smaller downloads for whoever knows their device's
      # architecture. The universal APK stays the simple, no-judgment-call
      # default (see README).
      - name: Build and verify per-ABI split APKs (F-Droid reproducible-build reference)
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BASE_CODE=${{ steps.version.outputs.code }}
          VERSION_NAME=${{ steps.version.outputs.name }}
          TAG=${{ steps.version.outputs.tag }}

          build_split() {
            ABI="$1"
            SUFFIX="$2"
            SPLIT_CODE=$((BASE_CODE * 10 + SUFFIX))
            echo "::group::Building $ABI (versionCode=$SPLIT_CODE)"

            rm -rf android
            node -e "
              const fs = require('fs');
              const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
              config.expo.version = '$VERSION_NAME';
              config.expo.android.versionCode = $SPLIT_CODE;
              fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
            "
            npx expo prebuild --platform android --no-install
            python3 tools/patch-release-signing.py
            (cd android && ./gradlew assembleRelease -PreactNativeArchitectures=$ABI)

            OUT="remindiary-${TAG}-${ABI}.apk"
            cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
            tools/verify-release-apk.sh "$OUT" "$SPLIT_CODE" "'$ABI'"
            echo "::endgroup::"
          }

          build_split armeabi-v7a 1
          build_split arm64-v8a 2

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            remindiary-${{ steps.version.outputs.tag }}.apk
            remindiary-${{ steps.version.outputs.tag }}.aab
            remindiary-${{ steps.version.outputs.tag }}-armeabi-v7a.apk
            remindiary-${{ steps.version.outputs.tag }}-arm64-v8a.apk
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
