# Builds a signed APK and AAB for the React Native app (the repository root)
# on tag push and attaches them to the same GitHub Release legacy-fyne's own
# release workflow publishes to - one tag, two apps' artifacts, since they
# are still the same product during the parity/migration period documented
# in CLAUDE.md.
#
# The two apps share one Android applicationId (xyz.hub13.remindiary, see
# app.json and legacy-fyne/FyneApp.toml) and are signed with the SAME
# keystore, on purpose: Android only allows an in-place upgrade (no
# uninstall) between two APKs with the same applicationId when they carry
# the same signing key. Whichever app a device has installed, the other can
# still replace it directly.
#
# Required repository secrets (shared with legacy-fyne-release.yml - see
# legacy-fyne/README.md "Signing setup" for how to generate the keystore and
# set these; do not create a second keystore for this workflow):
#   ANDROID_KEYSTORE_BASE64  - base64 of your .keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: React Native Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

env:
  BUNDLETOOL_VERSION: '1.18.3'

jobs:
  check:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci
      - run: npm run check

  release:
    name: Signed APK and AAB
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci

      # expo prebuild's generated Android project needs JDK 17; the runner's
      # default `java` is not guaranteed to be it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # apksigner and aapt (used below in "Verify artefacts") live in the
      # Android SDK's build-tools, which is not on PATH by default - same
      # step legacy-fyne-release.yml has for the same reason.
      - name: Configure Android toolchain
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"

      # Same packed-integer scheme as legacy-fyne-release.yml, reproduced
      # rather than shared so this workflow has no dependency on that one.
      # Reusing the identical formula matters here specifically because the
      # two apps share one applicationId and signing key (see header): their
      # versionCodes share one namespace, so whichever one a device last
      # installed must always be able to upgrade to whichever ships next,
      # regardless of which app built it.
      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          CORE="${VERSION%%-*}"
          SUFFIX="${VERSION#"$CORE"}"
          IFS=. read -r MAJOR MINOR PATCH <<EOF
          $CORE
          EOF
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          NUM=$(printf '%s' "$SUFFIX" | grep -oE '[0-9]+$' || true)
          NUM=${NUM:-0}
          case "$SUFFIX" in
            '')       STAGE=9; NUM=99 ;;
            -alpha*)  STAGE=1 ;;
            -beta*)   STAGE=2 ;;
            -rc*)     STAGE=3 ;;
            *) echo "::error::unrecognised pre-release suffix '$SUFFIX' in $TAG (expected -alpha/-beta/-rc)"; exit 1 ;;
          esac
          PRE=$((STAGE * 100 + NUM))
          for n in "$MAJOR" "$MINOR" "$PATCH" "$NUM"; do
            case "$n" in *[!0-9]*|'') echo "::error::bad version component in $TAG"; exit 1;; esac
          done
          [ "$MINOR" -le 99 ] && [ "$PATCH" -le 99 ] && [ "$NUM" -le 99 ] || {
            echo "::error::version component out of range for versionCode packing: $TAG"; exit 1; }
          CODE=$((MAJOR * 10000000 + MINOR * 100000 + PATCH * 1000 + PRE))
          echo "tag=$TAG"      >> "$GITHUB_OUTPUT"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE"    >> "$GITHUB_OUTPUT"
          echo "Building $TAG as versionName=$VERSION versionCode=$CODE"

      # expo prebuild bakes app.json's version/android.versionCode straight
      # into the generated build.gradle and AndroidManifest.xml, so this is
      # the one piece of the release build that does not need a post-prebuild
      # patch - it just needs the right input.
      - name: Set app.json version
        run: |
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            config.expo.version = '${{ steps.version.outputs.name }}';
            config.expo.android.versionCode = ${{ steps.version.outputs.code }};
            fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
          "

      - name: Prebuild the native Android project
        run: npx expo prebuild --platform android --no-install

      # expo prebuild's generated build.gradle signs the "release" build
      # type with the debug keystore by default - its own comment says as
      # much: "Caution! In production, you need to generate your own
      # keystore file." expo prebuild regenerates android/ from scratch
      # every run (Continuous Native Generation), so this has to be patched
      # here rather than hand-edited once. Anchored on the exact text of the
      # current Expo template; asserts both anchors are found exactly once,
      # so a future template change fails the build loudly instead of
      # quietly shipping a debug-signed "release" APK.
      - name: Patch release signing config
        run: |
          python3 - <<'PY'
          path = "android/app/build.gradle"
          with open(path) as f:
              content = f.read()

          debug_block = """    signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }"""
          assert content.count(debug_block) == 1, (
              "signingConfigs.debug block not found verbatim - "
              "Expo's generated build.gradle template may have changed"
          )
          release_block = debug_block[:-len("\n    }")] + """
                  release {
                      storeFile file(System.getenv("RELEASE_STORE_FILE"))
                      storePassword System.getenv("RELEASE_STORE_PASSWORD")
                      keyAlias System.getenv("RELEASE_KEY_ALIAS")
                      keyPassword System.getenv("RELEASE_KEY_PASSWORD")
                  }
              }"""
          content = content.replace(debug_block, release_block, 1)

          release_signing_line = """            // Caution! In production, you need to generate your own keystore file.
                      // see https://reactnative.dev/docs/signed-apk-android.
                      signingConfig signingConfigs.debug"""
          assert content.count(release_signing_line) == 1, (
              "release buildType's signingConfig line not found verbatim - "
              "Expo's generated build.gradle template may have changed"
          )
          content = content.replace(
              release_signing_line,
              release_signing_line.replace(
                  "signingConfig signingConfigs.debug",
                  "signingConfig signingConfigs.release",
              ),
              1,
          )

          with open(path, "w") as f:
              f.write(content)
          print("Patched release signingConfig into build.gradle")
          PY

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See legacy-fyne/README.md 'Signing setup'."
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Build signed AAB
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew bundleRelease

      # Obtainium installs APKs, not bundles; bundletool flattens the AAB
      # into one universal APK covering every ABI, signed with the same key.
      - name: Build universal APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.bundletool"
          curl -fsSL -o "$HOME/.bundletool/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          java -jar "$HOME/.bundletool/bundletool.jar" build-apks \
            --bundle=android/app/build/outputs/bundle/release/app-release.aab \
            --output="$RUNNER_TEMP/app.apks" \
            --mode=universal \
            --ks="$RUNNER_TEMP/keystore.jks" \
            --ks-pass="pass:$KS_PASS" \
            --ks-key-alias="$KEY_ALIAS" \
            --key-pass="pass:$KEY_PASS"
          unzip -p "$RUNNER_TEMP/app.apks" universal.apk \
            > "remindiary-rn-${{ steps.version.outputs.tag }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
            "remindiary-rn-${{ steps.version.outputs.tag }}.aab"

      # Assertions, not just output: a silent regression here ships a
      # broken, over-permissioned, or wrongly-signed build to everyone
      # running Obtainium - or, since this app shares its applicationId and
      # signing key with legacy-fyne (see header), one that can no longer
      # replace it in place.
      - name: Verify artefacts
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="remindiary-rn-${{ steps.version.outputs.tag }}.apk"

          apksigner verify --print-certs "$APK"

          TARGET=$(aapt dump badging "$APK" | sed -n "s/.*targetSdkVersion:'\([0-9]*\)'.*/\1/p")
          echo "targetSdkVersion=$TARGET"
          [ "$TARGET" -ge 35 ] || { echo "::error::targetSdkVersion $TARGET < 35"; exit 1; }

          # DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION is excluded deliberately:
          # it is a self-signature permission AndroidX Core auto-injects to
          # emulate Android 13's RECEIVER_NOT_EXPORTED flag on older API
          # levels (ContextCompat.registerReceiver()) - scoped to this app's
          # own package, unusable by any other app, invisible in Play
          # Store's permission listing. Legacy Fyne never hits this because
          # it doesn't pull in AndroidX Core; any RN/Expo app does.
          PERMS=$(aapt dump permissions "$APK" | grep 'uses-permission' \
            | grep -vc 'DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' || true)
          echo "declared permissions: $PERMS"
          [ "$PERMS" -eq 0 ] || {
            aapt dump permissions "$APK"
            echo "::error::APK declares $PERMS permission(s); expected none"; exit 1; }

          CODE=$(aapt dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          [ "$CODE" = "${{ steps.version.outputs.code }}" ] || {
            echo "::error::versionCode $CODE != ${{ steps.version.outputs.code }}"; exit 1; }

          # Confirms the signing-config patch actually took effect: the
          # APK's certificate fingerprint must match the real release
          # keystore's, not the debug one build.gradle defaults to.
          APK_FPR=$(apksigner verify --print-certs "$APK" \
            | sed -n 's/.*SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f')
          KS_FPR=$(keytool -list -v -keystore "$RUNNER_TEMP/keystore.jks" \
            -storepass "$KS_PASS" -alias "$KEY_ALIAS" \
            | sed -n 's/.*SHA256: *//p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          [ -n "$APK_FPR" ] && [ "$APK_FPR" = "$KS_FPR" ] || {
            echo "::error::APK is not signed with the release keystore (signing patch did not apply)"
            echo "apksigner: $APK_FPR"
            echo "keystore:  $KS_FPR"
            exit 1; }

          aapt dump badging "$APK" | grep -E '^package|native-code'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            remindiary-rn-${{ steps.version.outputs.tag }}.apk
            remindiary-rn-${{ steps.version.outputs.tag }}.aab
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
