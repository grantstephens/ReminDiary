<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    ReminDiary launcher icon.

    Three stacked date cards: the bright one is today, the faded ones behind it
    are the same day in previous years, which is the whole point of the app.

    Full-bleed background with the artwork inside the centre, so Android's
    adaptive-icon mask can crop to a circle or squircle without clipping it.
    The numeral is an outlined path, not <text>, so the file renders the same
    on a machine with no fonts installed.
  -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2E4463"/>
      <stop offset="1" stop-color="#121B27"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.68">
      <stop offset="0" stop-color="#6C93BE" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#6C93BE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF5E4"/>
      <stop offset="1" stop-color="#E8D9B6"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#AFA283"/>
      <stop offset="1" stop-color="#93876C"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#77705C"/>
      <stop offset="1" stop-color="#5E594A"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3BE55"/>
      <stop offset="1" stop-color="#D89830"/>
    </linearGradient>
    <filter id="drop" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="-4" dy="8" stdDeviation="10" flood-color="#060B12" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <g transform="translate(26 -4)">
    <rect x="158" y="140" width="196" height="240" rx="26" fill="url(#back)"
          filter="url(#drop)" transform="rotate(-14 256 420)"/>
    <rect x="158" y="140" width="196" height="240" rx="26" fill="url(#mid)"
          filter="url(#drop)" transform="rotate(-7 256 420)"/>

    <g filter="url(#drop)">
      <rect x="158" y="140" width="196" height="240" rx="26" fill="url(#front)"/>
      <path d="M158 166 a26 26 0 0 1 26-26 h144 a26 26 0 0 1 26 26 v32 h-196 z" fill="url(#band)"/>
      <path d="m 251.96289,326 h -54.91504 v -13.45703 l 18.47754,-18.68457 q 5.74512,-6.00391 8.90234,-9.62695 3.20899,-3.62305 4.50293,-6.15918 1.29395,-2.53614 1.29395,-5.2793 0,-3.36426 -2.17383,-4.86524 -2.17383,-1.50097 -5.12402,-1.50097 -3.57129,0 -7.2461,2.07031 -3.62304,2.01855 -8.22949,6.00391 l -11.23144,-13.14649 q 3.41601,-3.05371 7.24609,-5.79687 3.83008,-2.79492 9.05762,-4.55469 5.22754,-1.75977 12.73242,-1.75977 7.71191,0 13.35351,2.69141 5.69336,2.69141 8.79883,7.40137 3.10547,4.6582 3.10547,10.61035 0,6.57324 -2.43262,11.74902 -2.38085,5.12403 -7.19433,10.29981 -4.81348,5.12402 -12.00781,11.6455 l -5.53809,4.96875 v 0.51758 h 28.62207 z m 7.66016,-31.98633 q 0,-6.52148 0.93164,-12.93945 0.93164,-6.46973 3.36426,-12.16309 2.43261,-5.74511 6.88378,-10.14453 4.45118,-4.45117 11.43848,-6.9873 6.98731,-2.53614 17.02832,-2.53614 2.22559,0 5.43457,0.25879 3.20899,0.25879 5.33106,0.6211 v 15.99316 q -2.12207,-0.41406 -4.76172,-0.67285 -2.63965,-0.31055 -6.46973,-0.31055 -7.66016,0 -12.11133,2.3291 -4.39941,2.27735 -6.36621,6.57325 -1.9668,4.29589 -2.27734,10.2998 h 0.62109 q 1.9668,-3.72656 5.43457,-6.26269 3.46778,-2.53614 9.52344,-2.53614 9.9375,0 15.5791,6.41797 5.6416,6.41797 5.6416,18.16699 0,12.73243 -7.19433,19.82325 -7.14258,7.09082 -19.5127,7.09082 -8.12598,0 -14.5957,-3.51954 -6.41797,-3.51953 -10.19629,-10.81738 -3.72656,-7.34961 -3.72656,-18.68457 z m 28.05273,16.82129 q 3.26074,0 5.2793,-2.48437 2.07031,-2.48438 2.07031,-7.81543 0,-4.2959 -1.70801,-6.72852 -1.65625,-2.48437 -5.43457,-2.48437 -3.77832,0 -5.84863,2.58789 -2.07031,2.53613 -2.07031,5.58984 0,2.69141 0.77636,5.33105 0.82813,2.5879 2.53614,4.2959 1.708,1.70801 4.39941,1.70801 z" fill="#1B2836"/>
    </g>
  </g>
</svg>
